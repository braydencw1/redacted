stages:
  - tag
  - lint
  - build
  - upload_nexus
  - release

variables:
  OUTPUT: "redactd-linux-amd64"
  REPO_SUB_URL: "/repository/public"

tag:
  stage: tag
  image: "golang:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - |
      if [ -n "$ADDITIONAL_CA_CERT_BUNDLE" ]; then
        echo "$ADDITIONAL_CA_CERT_BUNDLE" > /usr/local/share/ca-certificates/additional-ca.crt
        update-ca-certificates
      fi
  script:
    - "go install github.com/caarlos0/svu@latest"
    - "git fetch --tags"
    - "NEXT=$(svu next)"
    - "echo \"next tag: ${NEXT}\""
    - |
      if git ls-remote --tags "https://gitlab-ci-token:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "refs/tags/${NEXT}" | grep -q .; then
        echo "tag $NEXT already exists on remote, skipping"
      else
        git tag -f "$NEXT"
        git push "https://gitlab-ci-token:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$NEXT"
      fi

lint:
  image: "rust:latest"
  stage: lint
  script:
    - "rustup component add clippy rustfmt"
    - "cargo fmt -- --check"
    - "cargo clippy --all-targets -- -D warnings"

build:
  image: "rust:latest"
  stage: build
  script:
    - "cargo build --release"
    - "cp target/release/redactd ${OUTPUT}"
    - "./${OUTPUT} version"
  artifacts:
    paths:
      - "${OUTPUT}"
  only:
    - tags

upload_nexus:
  image: "rust:latest"
  stage: upload_nexus
  script:
    - "curl -u ${NEXUS_USER}:${NEXUS_PASS} -k --upload-file ${OUTPUT} ${NEXUS_URL}${REPO_SUB_URL}/redactd/linux/v${CI_COMMIT_TAG}/${OUTPUT}"
  artifacts:
    paths:
      - "${OUTPUT}"
  only:
    - tags

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    paths:
      - "${OUTPUT}"
  script:
    - echo "running release_job"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: '$CI_COMMIT_TAG'
    name: 'Release v$CI_COMMIT_TAG'
    assets:
      links:
        - name: "${OUTPUT}"
          url: "${CI_JOB_URL}/artifacts/file/${OUTPUT}"
